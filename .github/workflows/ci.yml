name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_MODE: production
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/erp?schema=public"
      JWT_SECRET: "ci-dummy-jwt-secret-change-me-32-chars-minimum"
      SETUP_TOKEN: "ci-dummy-setup-token-change-me"
      ACCESS_TOKEN_TTL_SECONDS: "900"
      REFRESH_TOKEN_TTL_SECONDS: "2592000"
      NEXT_PUBLIC_APP_ENV: "staging"
      ERP_SCALE_INGEST_TOKEN: "ci-dummy-scale-token-32chars-minimum"
      ERP_SCALE_USER_ID: "user-production"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run ERP domain tests
        run: pnpm test:erp

      - name: Build Next.js application
        run: pnpm build

      - name: Apply migrations on disposable CI database
        run: pnpm db:deploy
      - name: Install local browser dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Local production browser regression
        run: |
          pnpm start:web > /tmp/factory-test.log 2>&1 &
          for i in $(seq 1 60); do curl -s http://127.0.0.1:3000/login >/dev/null && break; sleep 1; done
          FACTORY_TEST_URL=http://127.0.0.1:3000 pnpm test:browser
